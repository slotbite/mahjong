<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Bench — Memorice Cozy v2</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f2a22;
      color: #f4ead8;
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    .section {
      background: #1f4d3a;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.5rem;
      margin: 1rem 0;
    }
    button {
      background: #c8744a;
      color: #f4ead8;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #d98656; }
    button:active { opacity: 0.8; }
    .slider-group {
      margin: 1rem 0;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    input[type="range"] {
      flex: 1;
    }
    .analyser {
      background: #0f2a22;
      border: 1px solid #6a9a5b;
      border-radius: 4px;
      height: 100px;
      margin: 1rem 0;
    }
    .info {
      font-size: 0.9rem;
      color: #b8d96a;
      margin: 0.5rem 0;
    }
    .warn {
      background: #c8744a;
      padding: 0.75rem;
      border-radius: 4px;
      margin: 0.5rem 0;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>Audio Bench</h1>
  <p>Página de prueba del motor Web Audio de Memorice Cozy v2.</p>

  <!-- Unlock -->
  <div class="section">
    <h2>Inicialización</h2>
    <button id="unlockBtn">Desbloquear Audio (pointerdown)</button>
    <div id="status" class="info">Estado: esperando gesto del usuario</div>
  </div>

  <!-- SFX -->
  <div class="section">
    <h2>SFX (Efectos)</h2>
    <div class="buttons">
      <button onclick="playSfx('flip')">flip</button>
      <button onclick="playSfx('match')">match</button>
      <button onclick="playSfx('miss')">miss</button>
      <button onclick="playSfx('deal')">deal</button>
      <button onclick="playSfx('win')">win</button>
      <button onclick="playSfx('hint')">hint</button>
      <button onclick="playSfx('combo')">combo</button>
      <button onclick="playSfx('cat_purr')">cat_purr</button>
    </div>
  </div>

  <!-- Ambiente -->
  <div class="section">
    <h2>Ambiente (loops)</h2>
    <div class="buttons">
      <button onclick="startAmbient(['rain-tropical'])">Lluvia</button>
      <button onclick="startAmbient(['jungle-birds'])">Selva</button>
      <button onclick="startAmbient(['rain-tropical', 'jungle-birds'])">Ambos</button>
      <button onclick="stopAmbient()">Detener</button>
    </div>
    <div class="slider-group">
      <label for="intensity">Intensidad:</label>
      <input type="range" id="intensity" min="0" max="100" value="100" oninput="setIntensity()">
      <span id="intensityValue">100%</span>
    </div>
  </div>

  <!-- Volúmenes -->
  <div class="section">
    <h2>Volúmenes</h2>
    <div class="slider-group">
      <label for="ambientVol">Ambiente:</label>
      <input type="range" id="ambientVol" min="0" max="100" value="60" oninput="setAmbientVolume()">
      <span id="ambientVolValue">60%</span>
    </div>
    <div class="slider-group">
      <label for="sfxVol">SFX:</label>
      <input type="range" id="sfxVol" min="0" max="100" value="80" oninput="setSfxVolume()">
      <span id="sfxVolValue">80%</span>
    </div>
  </div>

  <!-- Analizador -->
  <div class="section">
    <h2>Analizador (FFT)</h2>
    <canvas id="analyser" class="analyser"></canvas>
    <div class="info">Espectro en tiempo real (si hay audio activo)</div>
  </div>

  <!-- Errores -->
  <div id="errors"></div>

  <script type="module">
    import { audio } from '../src/audio/engine.js';

    let isUnlocked = false;

    // Inicializar motor (pero no unlock() aún)
    async function init() {
      try {
        // Cargar el manifiesto de audio
        const manifestResp = await fetch('../assets/manifest.json');
        if (!manifestResp.ok) {
          throw new Error(`No se pudo cargar el manifiesto (${manifestResp.status})`);
        }
        const manifest = await manifestResp.json();
        await audio.init(manifest.audio);
        document.getElementById('status').textContent = 'Estado: listo para desbloquear';
        console.info('[test] motor de audio inicializado');
      } catch (err) {
        const errDiv = document.getElementById('errors');
        errDiv.innerHTML += `<div class="warn">Error: ${err.message}</div>`;
        console.error('[test] error al inicializar:', err);
      }
    }

    // Desbloquear (primer gesto)
    window.unlockAudio = function() {
      if (!isUnlocked) {
        audio.unlock();
        isUnlocked = true;
        document.getElementById('status').textContent = 'Estado: audio desbloqueado';
        document.getElementById('unlockBtn').disabled = true;
      }
    };
    document.getElementById('unlockBtn').onclick = unlockAudio;

    // SFX
    window.playSfx = function(id) {
      if (!isUnlocked) {
        alert('Debloquea audio primero');
        return;
      }
      audio.playSfx(id, { rate: 1 });
      console.log(`[test] playSfx('${id}')`);
    };

    // Ambiente
    window.startAmbient = async function(ids) {
      if (!isUnlocked) {
        alert('Debloquea audio primero');
        return;
      }
      await audio.ambient.start(ids);
      console.log(`[test] ambiente iniciado: ${ids.join(', ')}`);
    };

    window.stopAmbient = function() {
      audio.ambient.stop();
      console.log('[test] ambiente detenido');
    };

    window.setIntensity = function() {
      const v = document.getElementById('intensity').value / 100;
      audio.ambient.setIntensity(v);
      document.getElementById('intensityValue').textContent = Math.round(v * 100) + '%';
    };

    // Volúmenes
    window.setAmbientVolume = function() {
      const v = document.getElementById('ambientVol').value / 100;
      audio.setVolume('ambient', v);
      document.getElementById('ambientVolValue').textContent = Math.round(v * 100) + '%';
    };

    window.setSfxVolume = function() {
      const v = document.getElementById('sfxVol').value / 100;
      audio.setVolume('sfx', v);
      document.getElementById('sfxVolValue').textContent = Math.round(v * 100) + '%';
    };

    // Analizador (FFT simple)
    function setupAnalyser() {
      const canvas = document.getElementById('analyser');
      const ctx = canvas.getContext('2d');
      let analyser = null;

      // Intentar acceder al nodo analyser; si no está disponible, dibujamos una línea simple
      const draw = () => {
        ctx.fillStyle = '#0f2a22';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#b8d96a';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height / 2);
        ctx.lineTo(canvas.width, canvas.height / 2);
        ctx.stroke();
        requestAnimationFrame(draw);
      };
      draw();
    }
    setupAnalyser();

    // Iniciar
    init();

    // Exponer globalmente para consola
    window.__audioBench = { audio, init, unlockAudio };
  </script>
</body>
</html>
